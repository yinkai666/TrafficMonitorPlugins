name: Build Stock Plugin

on:
  push:
    branches: [ clistery, main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ clistery, main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [Release]
        platform: [x64, x86]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build
      run: msbuild TrafficMonitorPlugins.sln /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }}

    - name: Upload Stock Plugin
      uses: actions/upload-artifact@v4
      with:
        name: Stock-${{ matrix.platform }}
        path: |
          ${{ matrix.platform == 'x64' && 'bin/x64/Release/Stock.dll' || 'bin/Release/Stock.dll' }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Download x64 artifact
      uses: actions/download-artifact@v4
      with:
        name: Stock-x64
        path: Stock-x64

    - name: Download x86 artifact
      uses: actions/download-artifact@v4
      with:
        name: Stock-x86
        path: Stock-x86

    - name: Rename files
      run: |
        mv Stock-x64/Stock.dll Stock-x64.dll
        mv Stock-x86/Stock.dll Stock-x86.dll

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          Stock-x64.dll
          Stock-x86.dll
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
